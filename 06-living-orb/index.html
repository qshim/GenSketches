<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
    </main>
        <script>
    /* slider-override-marker */
      if (new URLSearchParams(location.search).get("hide") === "1") {
        var styleEl = document.createElement("style");
        styleEl.textContent = "input[type=range],label,.p5Canvas + *:not(canvas),body > div:not(main),#__rec_btn,#__rec_indicator,#__rec_countdown{display:none !important;visibility:hidden !important;} body{background:#000 !important;}";
        document.head.appendChild(styleEl);
      }
    (function(){
      var params = new URLSearchParams(location.search);
      var idx = 0;
      var iv = setInterval(function(){
        if (typeof window.createSlider === "function") {
          clearInterval(iv);
          var orig = window.createSlider;
          window.createSlider = function(min, max, val, step){
            var k = "s" + (++idx);
            var v = params.get(k);
            if (v !== null) val = parseFloat(v);
            return orig(min, max, val, step);
          };
        }
      }, 5);
    })();
    </script>
    <script>
    /* recorder-marker — bottom-left button toggles canvas recording */
    (function(){
      var rec = null, chunks = [], recording = false, mime = '';
      var btn, dot;

      function pickMime(){
        var c = [
          'video/mp4;codecs=avc1.640034,mp4a.40.2',
          'video/mp4;codecs=avc1.42E01E',
          'video/mp4',
          'video/webm;codecs=vp9',
          'video/webm;codecs=vp8',
          'video/webm'
        ];
        for (var i=0;i<c.length;i++){
          if (window.MediaRecorder && MediaRecorder.isTypeSupported(c[i])) return c[i];
        }
        return '';
      }

      function ensureButton(){
        if (document.getElementById('__rec_btn')) return;
        var style = document.createElement('style');
        style.textContent = [
          '#__rec_btn{position:fixed;left:20px;bottom:20px;z-index:99999;display:flex;align-items:center;gap:10px;',
          'background:rgba(0,0,0,0.72);color:#e8e8e8;border:1px solid #1697ff;border-radius:999px;',
          'padding:10px 18px 10px 14px;font:600 12px Inter,-apple-system,sans-serif;letter-spacing:.08em;',
          'cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);user-select:none;',
          'transition:background .15s ease,color .15s ease,border-color .15s ease;}',
          '#__rec_btn:hover{background:#1697ff;color:#000;}',
          '#__rec_btn .__dot{width:10px;height:10px;border-radius:50%;background:#1697ff;transition:background .15s ease;}',
          '#__rec_btn:hover .__dot{background:#000;}',
          '#__rec_btn.is-recording{border-color:#ff2d2d;color:#fff;}',
          '#__rec_btn.is-recording:hover{background:#ff2d2d;color:#fff;}',
          '#__rec_btn.is-recording .__dot{background:#ff2d2d;animation:recblink 1s infinite;}',
          '#__rec_btn.is-recording:hover .__dot{background:#fff;}',
          '@keyframes recblink{0%,100%{opacity:1}50%{opacity:.25}}',
          '#__rec_countdown{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:99998;background:rgba(0,0,0,0.55);color:#1697ff;font:700 220px Inter,-apple-system,sans-serif;letter-spacing:-0.04em;pointer-events:none;}'
        ].join('');
        document.head.appendChild(style);

        btn = document.createElement('button');
        btn.id = '__rec_btn';
        btn.type = 'button';
        btn.setAttribute('aria-label', 'Record canvas');
        btn.innerHTML = '<span class="__dot"></span><span class="__label">RECORD</span>';
        btn.addEventListener('click', function(e){
          e.preventDefault();
          btn.blur();
          if (!recording) beginCountdown(); else stop();
        });
        document.body.appendChild(btn);
        dot = btn.querySelector('.__dot');
      }

      function setBtnState(on){
        if (!btn) return;
        btn.classList.toggle('is-recording', on);
        btn.querySelector('.__label').textContent = on ? 'STOP & EXPORT' : 'RECORD';
      }

      function beginCountdown(){
        if (recording) return;
        var overlay = document.getElementById('__rec_countdown');
        if (!overlay){
          overlay = document.createElement('div');
          overlay.id = '__rec_countdown';
          document.body.appendChild(overlay);
        }
        overlay.style.display = 'flex';
        var n = 3;
        overlay.textContent = String(n);
        if (btn) { btn.querySelector('.__label').textContent = 'STARTING IN ' + n; }
        var iv = setInterval(function(){
          n -= 1;
          if (n > 0){
            overlay.textContent = String(n);
            if (btn) btn.querySelector('.__label').textContent = 'STARTING IN ' + n;
          } else {
            clearInterval(iv);
            overlay.style.display = 'none';
            start();
          }
        }, 1000);
      }

      function start(){
        var canvas = document.querySelector('canvas');
        if (!canvas){ alert('[REC] canvas not ready yet — try again in a moment.'); return; }
        if (!window.MediaRecorder){ alert('[REC] MediaRecorder not supported in this browser.'); return; }
        var stream;
        try { stream = canvas.captureStream(60); }
        catch(e){ alert('[REC] captureStream failed: ' + e.message); return; }
        mime = pickMime();
        try {
          rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12000000 } : { videoBitsPerSecond: 12000000 });
        } catch(e){ alert('[REC] MediaRecorder init failed: ' + e.message); return; }
        chunks = [];
        rec.ondataavailable = function(e){ if (e.data && e.data.size) chunks.push(e.data); };
        rec.onstop = function(){
          var ext = (mime||'').indexOf('mp4') !== -1 ? 'mp4' : 'webm';
          var blob = new Blob(chunks, { type: mime || 'video/webm' });
          var ts = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
          var name = (location.pathname.split('/').filter(Boolean).slice(-1)[0]) || 'sketch';
          var a = document.createElement('a');
          a.download = name + '-' + ts + '.' + ext;
          a.href = URL.createObjectURL(blob);
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
          setBtnState(false);
          console.log('[REC] saved', a.download, '(' + (blob.size/1048576).toFixed(2) + ' MB,', mime + ')');
        };
        rec.start();
        recording = true;
        setBtnState(true);
        console.log('[REC] started, mime =', mime || 'default');
      }

      function stop(){
        if (rec && rec.state !== 'inactive') rec.stop();
        recording = false;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', ensureButton);
      } else { ensureButton(); }
    })();
    </script>
    <script src="sketch.js"></script>
  </body>
</html>
